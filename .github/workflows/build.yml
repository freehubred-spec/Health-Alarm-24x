- name: Checkout Code
    uses: actions/checkout@v4

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: 'zulu'
      java-version: '17'

  - name: Setup Flutter
    uses: subosito/flutter-action@v2
    with:
      channel: 'stable'

  - name: Create Android Project
    run: flutter create --project-name health_alarm_24x .

  - name: Set Min SDK Version
    run: |
      echo "flutter.minSdkVersion=28" >> android/local.properties
      echo "flutter.compileSdkVersion=34" >> android/local.properties
      echo "flutter.targetSdkVersion=34" >> android/local.properties
      sed -i 's/minSdkVersion .*/minSdkVersion 28/g' android/app/build.gradle || true
      sed -i 's/minSdk = .*/minSdk = 28/g' android/app/build.gradle.kts || true
      sed -i 's/flutter.minSdkVersion/28/g' android/app/build.gradle || true
      sed -i 's/flutter.minSdkVersion/28/g' android/app/build.gradle.kts || true

  - name: Install Dependencies
    run: flutter pub get

  - name: Build APK
    run: flutter build apk --release

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Health-Alarm-APK
      path: build/app/outputs/flutter-apk/app-release.apk
