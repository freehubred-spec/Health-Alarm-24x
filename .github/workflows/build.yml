name: FINAL FLUTTER BUILD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 3. Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 4. Create Android Files
        run: flutter create --project-name health_alarm_24x .
          
      - name: 5. Force Fix Android SDK Version
        run: |
          # Set SDK versions in local.properties
          echo "flutter.minSdkVersion=26" >> android/local.properties
          echo "flutter.compileSdkVersion=34" >> android/local.properties
          echo "flutter.targetSdkVersion=34" >> android/local.properties
          
          # Forcefully replace variables in Gradle files
          sed -i 's/flutter\.minSdkVersion/26/g' android/app/build.gradle || true
          sed -i 's/flutter\.minSdkVersion/26/g' android/app/build.gradle.kts || true
          
          # Forcefully overwrite minSdk rules
          sed -i 's/minSdk = .*/minSdk = 26/g' android/app/build.gradle.kts || true
          sed -i 's/minSdkVersion .*/minSdkVersion 26/g' android/app/build.gradle || true
          sed -i 's/minSdk .*/minSdk 26/g' android/app/build.gradle || true

      - name: 6. Install Dependencies
        run: flutter pub get

      - name: 7. Build APK
        run: flutter build apk --release

      - name: 8. Upload App
        uses: actions/upload-artifact@v4
        with:
          name: Health-Alarm-APK
          path: build/app/outputs/flutter-apk/app-release.apk
