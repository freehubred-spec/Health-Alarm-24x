 - name: 1. Checkout Code
    uses: actions/checkout@v4

  - name: 2. Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: 'zulu'
      java-version: '17'

  - name: 3. Setup Flutter
    uses: subosito/flutter-action@v2
    with:
      channel: 'stable'

  - name: 4. Create Android Files
    run: flutter create --project-name health_alarm_24x .

  - name: 5. Force Fix Android SDK Version via Python
    run: |
      python3 -c '
      import os, re
      
      for root, dirs, files in os.walk("android"):
          for file in files:
              if "build.gradle" in file or file == "local.properties":
                  filepath = os.path.join(root, file)
                  with open(filepath, "r") as f:
                      content = f.read()
                  
                  content = re.sub(r"flutter\.minSdkVersion", "26", content)
                  content = re.sub(r"minSdkVersion\s+\d+", "minSdkVersion 26", content)
                  content = re.sub(r"minSdk\s*=\s*\d+", "minSdk = 26", content)
                  
                  with open(filepath, "w") as f:
                      f.write(content)
      print("Successfully patched all Android build files to SDK 26!")
      '

  - name: 6. Install Dependencies
    run: flutter pub get

  - name: 7. Build APK
    run: flutter build apk --release

  - name: 8. Upload App
    uses: actions/upload-artifact@v4
    with:
      name: Health-Alarm-APK
      path: build/app/outputs/flutter-apk/app-release.apk
