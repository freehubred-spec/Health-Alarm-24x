name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Accept Android Licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Clean and Generate Android Platform
      run: |
        rm -rf android
        flutter create --platforms=android --org com.healthalarm .

    - name: Configure MinSDK, CompileSDK and MultiDex
      run: |
        python3 -c "
import os, re

files = ['android/app/build.gradle', 'android/app/build.gradle.kts']
for path in files:
    if os.path.exists(path):
        with open(path, 'r') as f:
            text = f.read()
        
        # Set MinSDK to 21
        text = re.sub(r'minSdkVersion\s+.*', 'minSdkVersion = 21', text)
        text = re.sub(r'minSdk\s*=.*', 'minSdk = 21', text)
        
        # Set CompileSDK to 34
        text = re.sub(r'compileSdkVersion\s+.*', 'compileSdkVersion = 34', text)
        text = re.sub(r'compileSdk\s*=.*', 'compileSdk = 34', text)

        # Enable MultiDex
        if 'multiDexEnabled' not in text:
            text = re.sub(r'(defaultConfig\s*\{)', r'\1\n        multiDexEnabled = true', text)

        with open(path, 'w') as f:
            f.write(text)
        print('Successfully configured:', path)
"

    - name: Configure Gradle Properties
      run: |
        echo "android.useAndroidX=true" >> android/gradle.properties
        echo "android.enableJetifier=true" >> android/gradle.properties

    - name: Get Flutter Dependencies
      run: flutter pub get

    - name: Build Debug APK
      run: flutter build apk --debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: health-alarm-apk
        path: build/app/outputs/flutter-apk/app-debug.apk
