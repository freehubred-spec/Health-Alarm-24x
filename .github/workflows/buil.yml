name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Java 17
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Generate Android Project
      run: |
        rm -rf android
        flutter create --platforms=android --org com.healthalarm .

    - name: Update Android SDK Config
      run: |
        sed -i 's/minSdkVersion.*/minSdkVersion 21/g' android/app/build.gradle || true
        sed -i 's/compileSdkVersion.*/compileSdkVersion 34/g' android/app/build.gradle || true
        sed -i 's/targetSdkVersion.*/targetSdkVersion 34/g' android/app/build.gradle || true
        sed -i 's/minSdk.*/minSdk = 21/g' android/app/build.gradle || true
        sed -i 's/compileSdk.*/compileSdk = 34/g' android/app/build.gradle || true

    - name: Get Dependencies
      run: flutter pub get

    - name: Build Debug APK
      run: flutter build apk --debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: health-alarm-apk
        path: build/app/outputs/flutter-apk/app-debug.apk
