name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Clean & Create Native Android Structure
      run: |
        rm -rf android
        flutter create . --platforms=android --org com.healthalarm --template=app

    - name: Configure Android SDK versions
      run: |
        python3 -c "
import re
path = 'android/app/build.gradle'
with open(path, 'r') as f:
    text = f.read()

text = re.sub(r'minSdkVersion\s+.*', 'minSdkVersion 21', text)
text = re.sub(r'minSdk\s*=.*', 'minSdk = 21', text)
text = re.sub(r'compileSdkVersion\s+.*', 'compileSdkVersion 34', text)
text = re.sub(r'compileSdk\s*=.*', 'compileSdk = 34', text)

with open(path, 'w') as f:
    f.write(text)
"

    - name: Get Dependencies
      run: flutter pub get

    - name: Build Debug APK
      run: flutter build apk --debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: health-alarm-apk
        path: build/app/outputs/flutter-apk/app-debug.apk
