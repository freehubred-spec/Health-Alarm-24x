name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Fresh Android Project
        run: |
          flutter create --platforms=android --org com.healthalarm --project-name health_alarm_24x .

      - name: Set MinSdkVersion 21
        run: |
          python3 -c "
          import os, re
          for root, dirs, files in os.walk('android'):
              for file in files:
                  if file.startswith('build.gradle'):
                      p = os.path.join(root, file)
                      with open(p, 'r') as f:
                          t = f.read()
                      t = re.sub(r'flutter\.minSdkVersion', '21', t)
                      t = re.sub(r'minSdkVersion\s+.*', 'minSdkVersion 21', t)
                      t = re.sub(r'minSdk\s*=.*', 'minSdk = 21', t)
                      with open(p, 'w') as f:
                          f.write(t)
          "

      - name: Set Executable Permission
        run: chmod +x android/gradlew

      - name: Fetch Dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Health-Alarm-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
