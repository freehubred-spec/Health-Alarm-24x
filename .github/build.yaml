name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Alarm Sound File
        run: |
          mkdir -p assets
          python3 -c "import wave, struct, math; f=wave.open('assets/alarm.wav','w'); f.setnchannels(1); f.setsampwidth(2); f.setframerate(44100); f.writeframes(b''.join([struct.pack('<h', int(32767*0.5*math.sin(2*math.pi*880*i/44100))) for i in range(44100*3)])); f.close()"

      - name: Generate Android Platform
        run: |
          flutter create --platforms=android --org com.healthalarm --project-name health_alarm_24x .
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion 16/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion 19/minSdkVersion 21/g' android/app/build.gradle || true

      - name: Fetch Dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Health-Alarm-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
