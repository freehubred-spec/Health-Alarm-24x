name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Sound Asset
        run: |
          mkdir -p assets
          curl -sL https://raw.githubusercontent.com/rafaelreis-hotmart/Audio-Sample-files/main/sample.mp3 -o assets/alarm.mp3

      - name: Generate Android Platform
        run: flutter create --platforms=android --org com.healthalarm --project-name health_alarm_24x .

      - name: Add Android Permissions
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          PERMISSIONS='<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n<uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n<uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n<uses-permission android:name="android.permission.WAKE_LOCK" />\n<uses-permission android:name="android.permission.VIBRATE" />\n<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />'
          sed -i "/<manifest/a $PERMISSIONS" $MANIFEST_PATH

      - name: Set Permission for Gradle
        run: chmod +x android/gradlew

      - name: Fetch Dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Health-Alarm-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
