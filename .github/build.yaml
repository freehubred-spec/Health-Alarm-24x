name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Fresh Android Project
        run: |
          rm -rf android
          flutter create --platforms=android --org com.healthalarm --project-name health_alarm_24x .

      - name: Set Android MinSdkVersion to 21
        run: |
          python3 -c "
          import re
          path = 'android/app/build.gradle'
          with open(path, 'r') as f:
              text = f.read()
          text = re.sub(r'minSdkVersion\s+.*', 'minSdkVersion 21', text)
          text = re.sub(r'minSdk\s*=.*', 'minSdk = 21', text)
          text = re.sub(r'compileSdkVersion\s+.*', 'compileSdkVersion 34', text)
          text = re.sub(r'compileSdk\s*=.*', 'compileSdk = 34', text)
          with open(path, 'w') as f:
              f.write(text)
          print('Updated build.gradle with minSdk 21 successfully')
          "

      - name: Set Permission for Gradle
        run: chmod +x android/gradlew

      - name: Fetch Dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Health-Alarm-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
